[package]
name = "sovereign-daemon"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
iroh = "=1.3.0"
tokio = { version = "1.35", features = ["full"] }

[dev-dependencies]
# test-util: lets tests fast-forward time (tokio::time::pause).
tokio = { version = "1.35", features = ["full", "test-util"] }
